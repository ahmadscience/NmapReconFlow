name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n nmapReconFlow.sh
          for f in lib/*.sh; do bash -n "$f"; done
          bash -n install.sh
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Shellcheck
        run: shellcheck -x -e SC2034,SC2154 nmapReconFlow.sh lib/*.sh || true
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: bash tests/run_tests.sh
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bash 5
        run: brew install bash
      - name: Run tests
        run: /opt/homebrew/bin/bash tests/run_tests.sh || /usr/local/bin/bash tests/run_tests.sh
