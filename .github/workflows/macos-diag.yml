name: macOS script-scan diagnostics (temporary)
on:
  push:
    branches: [claude/cool-lamport-qEe1M]
    paths: ['.github/workflows/macos-diag.yml']

# One-off: find why `nmap -sCV` takes ~122s on macOS vs ~8s on Linux.
# Each step removes one factor; the per-script trace names the slow script.
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install nmap
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install nmap; else sudo apt-get update -qq && sudo apt-get install -y -qq nmap; fi
          nmap --version | head -1
      - name: Start web server and show resolver
        run: |
          mkdir www && echo hi > www/index.html
          (cd www && nohup python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          if [ "$RUNNER_OS" = macOS ]; then
            DNS="$(scutil --dns | awk '/nameserver\[0\]/{print $3; exit}')"
          else
            DNS="$(awk '/^nameserver/{print $2; exit}' /etc/resolv.conf)"
          fi
          echo "DNS=${DNS}" | tee -a "$GITHUB_ENV"
      - name: "Engines available"
        run: nmap -V | grep -i nsock || true
      - name: "H: -sV, nsock engine poll"
        run: time nmap --nsock-engine poll -sV -p8000 127.0.0.1 -oN /dev/null | tail -3
      - name: "I: -sV, nsock engine select"
        run: time nmap --nsock-engine select -sV -p8000 127.0.0.1 -oN /dev/null | tail -3
      - name: "J: -sV, default engine, with 15s limit + replies shown around GetRequest"
        run: |
          nmap -sV -p8000 --version-trace --host-timeout 20s 127.0.0.1 2>&1 \
            | grep -n -i -E -A4 'probe GetRequest|GetRequest.*(recv|read|match)|Received|bytes' | head -40 || true
      - name: "K: -sV against a real remote web server (scanme.nmap.org:80, allowed by Nmap)"
        run: time nmap -sV -p80 scanme.nmap.org -oN /dev/null | tail -4
      - name: "L: -sCV, poll engine (the tool's scan shape)"
        run: time nmap --nsock-engine poll -sCV -p8000 --open 127.0.0.1 -oN /dev/null | tail -3
      - name: "M: curl sanity check of the test server"
        run: time curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/
